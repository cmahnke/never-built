<!DOCTYPE html>
<html lang="{{ site.Language.Name }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {{- $cssOptions := dict "outputStyle" "compressed" "transpiler" "dartsass" "targetPath" "css/print.css" "includePaths" (slice "assets/css") -}}
    {{- $css := resources.Get "scss/print.scss" | toCSS $cssOptions | fingerprint -}}
    <link rel="stylesheet" href="{{ $css.RelPermalink }}" type="text/css" integrity="{{ $css.Data.Integrity }}">
  </head>
  <body>
    {{ block "content" . }}{{ end }}
  </body>
</html>
