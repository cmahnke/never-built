name: Publish on GitHub pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron:  '15 20 * * 3'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUGO_VERSION: 0.160.1
  DEPENDENCY_MANAGER: npm
  PYTHON_VERSION: '3.13'

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Free some disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/graalvm/ /usr/local/share/powershell /usr/local/lib/android /usr/local/.ghcup/ /usr/share/dotnet/ /opt/microsoft /usr/local/aws-* /usr/share/miniconda /opt/az /usr/share/kotlinc /usr/share/man /usr/share/sbt /usr/local/julia* /usr/share/az* /usr/share/apache-maven* /usr/share/gradle* /usr/share/swift
          df -h

      - uses: actions/checkout@v6
        with:
          submodules: true  # Fetch Hugo themes (true OR recursive)

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: '.nvmrc'

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install required dependencies
        run: |
          ./scripts/github-setup.sh

      # - name: Setup deploy env
      #   env:
      #     DEPLOY_SSH_IDENTITY: ${{ secrets.DEPLOY_SSH_IDENTITY }}
      #   run: |
      #     mkdir -p ~/.ssh && echo "$DEPLOY_SSH_IDENTITY" >>  ~/.ssh/known_hosts

      # - name: Setup Hugo
      #   uses: peaceiris/actions-hugo@v3.0.0
      #   with:
      #     hugo-version: ${{ env.HUGO_VERSION }}
      #     extended: true

      - name: Install Hugo
        run: |
          ./themes/projektemacher-base/scripts/github/setup-hugo.sh ${{ env.HUGO_VERSION }}

      - name: Create IIIF derivates
        run: docker run -e CHOWN_UID=${UID} -e URL_PREFIX="https://never-build.goettingen.xyz/" -v ${PWD}:${PWD} ghcr.io/cmahnke/iiif-action:latest-jxl-uploader sh -c "cd ${PWD} && ./scripts/iiif.sh"

      # - name: IIIF directory upload and cleanup
      #   env:
      #     DEPLOY_SERVER: ${{ secrets.DEPLOY_SERVER }}
      #     DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      #     SSHPASS: ${{ secrets.DEPLOY_PASS }}
      #     DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      #   run: |
      #     cd content
      #     find post -name info.json -exec dirname {} \; > files.lst
      #     cat files.lst | xargs chmod 775
      #     sshpass -e rsync -rlptoD --info=progress2 --size-only --delete --relative $(cat files.lst) $DEPLOY_USER@$DEPLOY_SERVER:$DEPLOY_PATH/backsteinexpressionismus/
      #     rm -f files.lst
      #     cd ..
      #     find content/post/ -name info.json -exec dirname {} \; | xargs -I {} find {} -mindepth 1 -type d -not -path '*/full*' | xargs rm -fr
      #     #find content/post/ -name info.json -exec dirname {} \; | xargs rm -r

      - name: Generate Files
        env:
          SKIP_IIIF: yes
        run: |
          ./scripts/setup.sh
          rm -f content/post/.gitignore
          sed -i '/static\/map/d' .gitignore

      - name: Generate stats
        run: |
          ./themes/projektemacher-base/scripts/stat.sh

      - name: Build Hugo site
        run: hugo --printI18nWarnings --printUnusedTemplates

      - name: Run post build script
        run: |
          ./scripts/post-build/index.sh

      # - name: Create export
      #   run: |
      #     hugo -F --renderSegments print
      #
      # - name: Generate catalogue
      #   run: |
      #     docker run -v `pwd`:`pwd` -w `pwd` yeslogic/prince:latest --fileroot `pwd`/future ./future/print.html -o book.pdf

      - name: Puppeteer
        run: ./themes/projektemacher-base/scripts/github/check-js-errors.sh

      - name: Archive links
        run: python ./themes/projektemacher-base/scripts/archive.py -d docs/ -e projektemacher.org -a 14 -o archived-urls.txt

      - name: Save URL list
        run: |
          cp archived-urls.txt docs/

      # - name: Copy future
      #   run: mv ./future ./docs/

      # - name: Cleanup Build
      #   run: |
      #     echo "Removing files not needed to be deployed on GitHub Pages"
      #     find docs -type f -size +10M -name '*.jpg' -print -exec rm {} \;
      #     find docs -type f -name 'ogPreview-tmp*.jpg' -print -exec rm {} \;
      #     find docs -type f -name '*.jxl' -print -exec rm {} \;
      #     find docs -type f -name 'vips-properties.xml' -print -exec rm {} \;
      #     find docs -type f -path '*/full/full/0/default.jpg' -print -exec rm {} \;
      #     rm -rf docs/plugins

      - name: Deploy site
        uses: peaceiris/actions-gh-pages@v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          force_orphan: true
